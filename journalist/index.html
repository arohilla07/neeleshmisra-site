NM.page=function(){
  var E=NM.esc;
  NM.$("#tl").innerHTML=NM.journalism.map(function(j){return '<div class="it rv">'+(j.y?'<div class="y">'+E(j.y)+'</div>':'')+'<h3>'+E(j.t)+'</h3>'+(j.b?'<p>'+E(j.b)+'</p>':'')+'</div>'}).join("");
